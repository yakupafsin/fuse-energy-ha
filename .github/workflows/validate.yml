name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Fuse changes its API without notice, and HACS/hassfest rules move too.
    # A weekly run means breakage is found before a user reports it.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
