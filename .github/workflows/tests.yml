name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The suite stubs the Home Assistant APIs it touches, so it needs no HA
        # install -- only the Python versions HA itself supports.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The only install. Home Assistant itself is stubbed (see tests/hastubs.py)
      # because it is heavyweight; aiohttp is a plain package and the integration
      # imports it at module scope, so CI runs against the real one.
      - run: pip install aiohttp
      - name: Run test suite
        working-directory: custom_components/fuse_energy
        run: python3 tests/test_fuse.py
